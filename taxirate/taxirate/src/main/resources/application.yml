spring :
    servlet :
        multipart :
            max-file-size :    10MB
            max-request-size : 10MB
    datasource :

        url :      jdbc:postgresql://localhost:5432/taxirate

        url :      jdbc:mysql://localhost:3306/taxirate


        username : postgres
        password : root
    jpa :
        hibernate :
            ddl-auto : update
        show-sql : true

        properties :
            hibernate :
                dialect : org.hibernate.dialect.PostgreSQLDialect
                jdbc :
                    lob :
                        non_contextual_creation : true


server :
    port : 8080
